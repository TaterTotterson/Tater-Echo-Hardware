[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "tater-echo-hardware"
version = "1.0.0"
description = "Hardware helpers, diagnostics and local-first research for Tater Echo satellites"
readme = "README.md"
requires-python = ">=3.9"
license = "AGPL-3.0-only"
authors = [{ name = "Tater Totterson AI LLC" }]
dependencies = []

[project.scripts]
tater-re = "tater_re.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]


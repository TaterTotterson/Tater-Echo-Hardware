[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "tater-hardware-research"
version = "0.1.0"
description = "Local-first firmware and hardware research workbench for Tater Echo targets"
readme = "README.md"
requires-python = ">=3.9"
license = "AGPL-3.0-only"
authors = [{ name = "Tater Totterson AI LLC" }]
dependencies = []

[project.scripts]
tater-re = "tater_re.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

